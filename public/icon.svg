<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Shield Base -->
  <path d="M256 90 L390 145 C390 280 256 385 256 385 C256 385 122 280 122 145 Z" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Fuel pump icon left side -->
  <g transform="translate(160, 180) scale(1.1)">
    <path d="M6 3 L20 3 C22 3 24 5 24 7 L24 38 C24 40 22 42 20 42 L6 42 C4 42 2 40 2 38 L2 7 C2 5 4 3 6 3 Z" fill="none" stroke="url(#amberGrad)" stroke-width="3" stroke-linejoin="round" />
    <path d="M6 9 L20 9 L20 19 L6 19 Z" fill="#fbbf24" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2" />
    <path d="M24 12 L29 16 C31 18 31 22 29 25 L27 27" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Log / Wood icon right side -->
  <g transform="translate(270, 180) scale(1.1)">
    <ellipse cx="14" cy="22" rx="7" ry="14" fill="#059669" fill-opacity="0.3" stroke="url(#emeraldGrad)" stroke-width="2.5" />
    <path d="M14 8 L38 8 C42 8 46 14 46 22 C46 30 42 36 38 36 L14 36" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" />
    <circle cx="14" cy="22" r="3" fill="#34d399" />
  </g>

  <!-- Central Peso / Dollar / Wallet Badge -->
  <circle cx="256" cy="305" r="42" fill="#10b981" />
  <circle cx="256" cy="305" r="37" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <text x="256" y="322" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#ecfdf5" text-anchor="middle">$</text>

  <!-- App Label banner -->
  <rect x="136" y="415" width="240" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <text x="256" y="443" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="3">CONTROL MÓVIL</text>
</svg>
